name: CI workflow for React

on:
    push: 
        branches:
            - main
            - develop
    workflow_dispatch:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: setup nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: check node version
              run: node -v

            - name: clone repository
              uses: actions/checkout@v2

            - name: list directories
              run: ls

            - name: install dependencies
              run: npm install

            - name: list directories
              run: ls

            - name: run tests
              run: npm test

            - name: run build
              run: npm run build